# web-app — run a single-container web app as one pod.
# See README.md for examples (flag injection, Kata, probes).

replicaCount: 1

image:
  repository: ""        # e.g. zot.asso-hzv.fr/wargame/2026/bokanovsky
  tag: latest
  # When set, the image is referenced by digest (repo@digest) and `tag` is
  # ignored. Immutable + content-addressed: lets the RKE2 embedded registry
  # mirror (Spegel) distribute it P2P reliably. e.g. sha256:deadbeef...
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []     # [ { name: regcred } ]
nameOverride: ""
fullnameOverride: ""

# Optional container entrypoint / args override (leave empty to use the image's).
command: []
args: []

# Environment variables. Use this to inject the challenge flag, e.g.
#   env:
#     FLAG: "leHACK{...}"
env: {}

# Pull env from existing Secrets / ConfigMaps.
envFrom: []
  # - secretRef:
  #     name: my-secret

# Port the app are listening to on inside of the container.
containerPorts:
  - name: http
    containerPort: 8080
    protocol: TCP

# RuntimeClass for the pod (e.g. kata-clh / kata-qemu). Empty = cluster default
# runtime, in which case user namespaces do the confining.
runtimeClassName: ""
# false = user-namespace isolation (k8s >= 1.33). Set true under Kata — the VM
# is the boundary — or on clusters without user namespaces.
hostUsers: true

podSecurityContext:
  {}
  # fsGroup: 1000
  # seccompProfile:
  #   type: RuntimeDefault

# Container security context. Defaults are hardened; the app keeps no Linux
# capabilities and cannot escalate privileges. Relax per-challenge if needed.
securityContext:
  capabilities:
    drop:
      - ALL
  allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "1"
    memory: "512Mi"

# Health probes. type: tcp (default, works for any listener) or http (set path).
# Set enabled: false to drop a probe. startup is disabled by default; enable it
# for apps with a slow first boot to hold readiness without flapping liveness.
probes:
  startup:
    enabled: false
    type: tcp
    path: /
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  liveness:
    enabled: true
    type: tcp
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    type: tcp
    path: /
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

# Optional durable volume. Most web challenges are stateless — leave disabled.
persistence:
  enabled: false
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  mountPath: /data
  size: "1Gi"

# Extra volumes / mounts (e.g. an emptyDir for /tmp under readOnlyRootFilesystem).
# Conteneurs supplementaires dans le MEME pod que `app`, ecrits tels quels
# (spec Kubernetes complete : image, env, ports, volumeMounts, securityContext...).
# Le pod partage un namespace reseau : ils se joignent entre eux sur 127.0.0.1, ce
# qu'aucun Service n'expose. Attention, `runtimeClassName` est par POD : tous les
# conteneurs partagent le meme runtime.
extraContainers: []
#   - name: sidecar
#     image: repo/sidecar:1.0
#     ports: [ { containerPort: 9000, name: side } ]

extraVolumes: []
extraVolumeMounts: []

networkPolicy:
  enabled: true
  # CTF default: lock outbound traffic so a popped app cannot phone home or
  # pivot. DNS is always allowed. Set true to permit all egress.
  allowEgress: false
  # Namespace (by metadata.name label) the ingress controller runs in; pods
  # there are allowed to reach this app. Adjust to your ingress/gateway ns.
  ingressNamespace: ingress-nginx
  # Ports SUPPLEMENTAIRES que la gateway peut joindre, en plus de containerPorts.
  # A utiliser avec extraContainers : les ports de ces conteneurs ne sont PAS
  # derives automatiquement, pour qu'un backend cense rester en loopback dans le
  # pod ne se retrouve pas ouvert a la gateway par accident.
  extraIngressPorts: []
  #   - { port: 8082 }

# Primary Service — the one the HTTPRoute/Ingress points at.
service:
  type: ClusterIP
  extraAnnotations: {}
  extraLabels: {}
  ports:
  - port: 80
    protocol: TCP
    targetPort: http
    name: http
  # NetworkPolicy: accept traffic from outside the cluster on this Service's
  # ports. Only meaningful when type is LoadBalancer/NodePort — that traffic has
  # no source namespace, so the gateway-namespace rule alone would drop it.
  externalIngress: false

# Additional Services, one object per entry. A Service carries a single `type`,
# so an app that speaks HTTP on one port and raw TCP on another cannot express
# both in one: the HTTP port belongs on a ClusterIP behind the gateway, the TCP
# port needs its own LoadBalancer, its own external-dns hostname and its own
# LB-pool label. `targetPort` names an entry of `containerPorts`.
extraServices: []
#   - name: tcp
#     type: LoadBalancer
#     labels:
#       lb-pool: public             # opt in to a specific LB-IPAM pool
#     annotations:
#       external-dns.alpha.kubernetes.io/hostname: tcp.chall.example.org
#     externalIngress: true         # let the NetworkPolicy accept outside traffic
#     loadBalancerIP: ""            # optional, pin an address
#     externalTrafficPolicy: ""     # e.g. Local to preserve the client IP
#     ports:
#       - name: tcp
#         port: 4444
#         targetPort: tcp           # must match a containerPorts entry name
#         protocol: TCP

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Gateway API HTTPRoute — alternative to Ingress for clusters using the
# Gateway API. Routes "/" to the chart's service.
httpRoute:
  enabled: false
  parentRefs: []
  #   - name: my-gateway
  #     namespace: default
  hostnames: []
  annotations: {}
  # Gateway API filters applied to the route rule, e.g. a ResponseHeaderModifier
  # to normalize a backend's WebSocket Upgrade token casing.
  filters: []
  # Regles explicites, pour exposer plusieurs chemins sur des ports differents du
  # meme pod. Vide => une seule regle `/` vers le premier port du Service.
  # Un backendRef sans `name` vise le Service du chart.
  rules: []
  #   - matches: [ { path: { type: PathPrefix, value: /api } } ]
  #     backendRefs: [ { port: 8082 } ]
  #   - matches: [ { path: { type: PathPrefix, value: / } } ]
  #     backendRefs: [ { port: 8081 } ]
  #   - type: ResponseHeaderModifier
  #     responseHeaderModifier:
  #       set:
  #         - name: Upgrade
  #           value: websocket

nodeSelector: {}
tolerations: []
affinity: {}

# Dploy-injected values (do not modify, set by dploy-api)
# username: ""
# uuid: ""
# ingressHost: ""
