{{- if .Values.networkPolicy.enabled -}}
{{/*
Ingress is scoped to the ports the app actually listens on. It used to read
`.Values.containerPort`, a value this chart no longer has (it is `containerPorts`,
a list) — that rendered `port: null`, which means *every* port, silently widening
the policy. Derived from containerPorts now.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "web-app.fullname" . }}
  labels:
    {{- include "web-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "web-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from the ingress controller / gateway namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        {{- range .Values.containerPorts }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .containerPort }}
        {{- end }}
        {{- /* Ports de conteneurs supplementaires que la gateway doit joindre.
               DELIBEREMENT explicite : deriver automatiquement les ports des
               extraContainers exposerait aussi ceux qui doivent rester internes
               au pod (un backend en loopback, p.ex.). */}}
        {{- range .Values.networkPolicy.extraIngressPorts }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .port }}
        {{- end }}
    {{- $external := include "web-app.externalPorts" . | fromYamlArray }}
    {{- with $external }}
    # Ports on a LoadBalancer are hit straight from outside the cluster: that
    # traffic carries no source namespace, so a namespaceSelector would drop it.
    # Opted into per Service with `externalIngress: true` — scoped to those
    # ports only, never a blanket allow.
    - ports:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  egress:
    # DNS is always allowed so in-cluster name resolution works.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.allowEgress }}
    # allowEgress: permit all other outbound traffic.
    - {}
    {{- end }}
{{- end }}
