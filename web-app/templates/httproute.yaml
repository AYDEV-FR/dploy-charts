{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "web-app.fullname" . -}}
{{- $svcPort := (first .Values.service.ports).port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "web-app.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- if .Values.ingressHost }}
  hostnames:
    - {{ .Values.ingressHost | quote }}
  {{- else if .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.httpRoute.rules }}
    {{- /* Regles explicites : chaque entree est une regle HTTPRoute telle quelle,
           a ceci pres qu'un backendRefs sans `name` vise le Service du chart. Sert
           aux applications qui exposent plusieurs chemins sur des ports differents
           du meme pod. */}}
    {{- range .Values.httpRoute.rules }}
    - {{- if .matches }}
      matches:
        {{- toYaml .matches | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        {{- range .backendRefs }}
        - name: {{ .name | default $fullName }}
          port: {{ .port }}
          {{- with .weight }}
          weight: {{ . }}
          {{- end }}
        {{- end }}
    {{- end }}
    {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- with .Values.httpRoute.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}
    {{- end }}
{{- end }}
