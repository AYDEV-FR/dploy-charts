# compose — run an unmodified docker-compose.yml as one sandboxed DinD pod.
# See README.md for how to build the OCI bundle / point at a git repo.

# How the stack is delivered into the pod. The guiding rule: NO registry or git
# credentials ever reach the sandbox (DinD/Kata). If the workload is compromised,
# there are no creds to steal.
source:
  type: oci            # oci | git

  # oci: a bundle IMAGE (not an oras artifact) mounted read-only as an
  # ImageVolume. The kubelet pulls it using pullSecrets — those creds never enter
  # the sandbox container. The image's filesystem holds:
  #   docker-compose.yml (+ referenced files/dirs) and an images/ dir of
  #   `docker save | gzip` tarballs. At boot the chart `docker load`s every
  #   images/*.tar.gz (so DinD never pulls from a registry) and copies everything
  #   else into the writable workdir.
  oci:
    reference: ""      # e.g. docker.io/ctfimages/gitea-compose:v1
    pullPolicy: IfNotPresent
    pullSecrets: []    # [ { name: regcred } ] — used by the kubelet, not mounted

  # git: an init container clones the repo into the workdir. Credentials from
  # credentialsSecret are mounted ONLY on that init container, never on DinD.
  git:
    repo: ""           # https://… or ssh://…
    ref: main          # branch, tag, or commit SHA
    subPath: ""        # optional sub-directory within the repo to use as the stack
    image: alpine/git:2.45.2
    # Secret with git credentials. https: keys `username` + `password` (or token
    # as password). ssh: key `ssh-privatekey`. Empty for public repos.
    credentialsSecret: ""

# Sandbox: RuntimeClass to run the pod under (e.g. kata-qemu). Empty = the
# cluster default runtime, in which case user namespaces do the confining.
runtimeClassName: ""
# false = user-namespace isolation (k8s >= 1.33). Set true under Kata — the VM
# is the boundary — or on clusters without user namespaces.
hostUsers: false

# Primary Service, exposing the ports a compose service PUBLISHES (the left side
# of "8080:80"). Services in the stack that publish nothing stay internal to the
# pod. This is the Service the HTTPRoute/Ingress and the probes point at.
service:
  type: ClusterIP

  # Legacy single port. Used ONLY when `ports` below is empty, and then exposed
  # under the name `entry` — kept so releases predating multi-port keep working.
  port: 8080

  # Multi-port form. Each entry becomes a Service port AND a containerPort.
  # targetPort defaults to port (a compose stack publishes on the pod network,
  # so the published port IS the container port); protocol defaults to TCP.
  ports: []
  #   - name: http          # <= 15 chars, it also names the containerPort
  #     port: 8080
  #     targetPort: 8080
  #     protocol: TCP

  # Port the startup/readiness probes and the HTTPRoute/Ingress backend use.
  # Defaults to the first entry of `ports`. Set it when the first published port
  # is not the one that signals the stack is up.
  probePort: ""

  extraAnnotations: {}
  extraLabels: {}

  # NetworkPolicy: accept traffic from outside the cluster on these ports. Only
  # meaningful when type is LoadBalancer/NodePort — that traffic has no source
  # namespace, so the gateway-namespace rule alone would drop it.
  externalIngress: false

# Additional Services, one object per entry. A Service has a single `type`, so a
# stack that publishes an HTTP port AND a raw TCP port cannot express both in one:
# the HTTP port belongs on a ClusterIP behind the gateway, the TCP port needs its
# own LoadBalancer, its own external-dns hostname and its own LB-pool label.
extraServices: []
#   - name: ssh                     # suffixed to the release name
#     type: LoadBalancer
#     labels:
#       lb-pool: public             # opt in to a specific LB-IPAM pool
#     annotations:
#       external-dns.alpha.kubernetes.io/hostname: ssh.chall.example.org
#     externalIngress: true         # let the NetworkPolicy accept outside traffic
#     loadBalancerIP: ""            # optional, pin an address
#     externalTrafficPolicy: ""     # e.g. Local to preserve the client IP
#     ports:
#       - name: ssh
#         port: 2200
#         targetPort: 2200
#         protocol: TCP

# DinD image (the stack's own images are loaded from the bundle, not from here).
#
# Under Kata, prefer an image that carries `fuse-overlayfs` (plus libfuse3 — the
# bare binary aborts on a missing symbol). /var/lib/docker is an emptyDir shared
# into the guest over virtio-fs, where overlay2 cannot mount; without
# fuse-overlayfs dockerd falls back to vfs, which copies every image layer whole.
# Measured on a 6-image bundle: `docker load` 217s -> 57s, `compose up` 33s -> 4s.
# `docker:28-dind` does NOT ship it; only the -dind-rootless variant does.
image: docker:28-dind

# Cold-start budget: periodSeconds x failureThreshold seconds before the kubelet
# kills the pod and starts over. The default 600s fits a large bundle on vfs;
# with fuse-overlayfs a 6-image stack is up in ~80s.
startupProbe:
  periodSeconds: 5
  failureThreshold: 120

# One pod runs the whole stack — size for everything in it.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

# Optional durable workdir (filesystem PVC). /var/lib/docker always stays an
# emptyDir (overlay-on-overlay otherwise).
persistence:
  enabled: false
  size: 10Gi
  storageClass: ""

# Optional Ingress. host is overridden by the dploy-injected ingressHost.
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""        # name of a TLS secret; empty = no TLS
  annotations: {}

# Optional Gateway API HTTPRoute (alternative to Ingress). Routes "/" to the service.
httpRoute:
  enabled: false
  parentRefs: []       # required when enabled: [{ name: my-gateway }]
  hostnames: []
  annotations: {}

# Dploy-injected values (set by dploy-api)
# username: ""
# uuid: ""
# ingressHost: ""

# Network isolation. This chart runs a privileged container, so the default is
# to lock outbound traffic: a popped stack cannot phone home, scan the cluster,
# or reach another team's challenge. DNS is always allowed.
networkPolicy:
  enabled: true
  allowEgress: false
  # Namespace (by metadata.name label) the ingress controller runs in.
  ingressNamespace: ingress-nginx
